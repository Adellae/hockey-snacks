name: Denní import z Týmuj

on:
  schedule:
    # 04:30 UTC = 06:30 v Praze (v létě 06:30 SELČ, v zimě 05:30 SEČ).
    # GitHub cron umí jen UTC a spouští s několikaminutovým zpožděním — nevadí.
    - cron: "30 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYMUJ_EMAIL: ${{ secrets.TYMUJ_EMAIL }}
          TYMUJ_PASSWORD: ${{ secrets.TYMUJ_PASSWORD }}
          TYMUJ_TEAM_ID: ${{ secrets.TYMUJ_TEAM_ID }}
        run: python -m snacks.ingest
